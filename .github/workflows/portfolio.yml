name: Portfolio CI/CD

on:
  push:
    branches:
      - main
      - '**'
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: portfolio-${{ github.ref }}
  cancel-in-progress: false

jobs:
  ci:
    name: Test and Build
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '22'
          package-manager-cache: false

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: TypeScript check
        run: npm run typecheck

      - name: Run tests
        run: npm run test:ci

      - name: Build frontend
        run: npm run build

      - name: Security audit
        run: npm audit --audit-level=high

      - name: Upload build artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: portfolio-dist
          path: frontend/dist/
          retention-days: 7
          if-no-files-found: error

  deploy:
    name: Deploy to AWS
    needs: ci
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    permissions:
      contents: read
      id-token: write

    env:
      AWS_REGION: us-east-1
      S3_BUCKET: alexpav.click
      DISTRIBUTION_ID: EJK2ZNMVGJ5HO

    steps:
      - name: Download build artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: portfolio-dist
          path: dist

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@45666896f5d8e0f10ae255413f3a4cdd03bdc8f5 # v6.3.1
        with:
          role-to-assume: arn:aws:iam::417886991538:role/portfolio-github-deploy
          aws-region: us-east-1
          allowed-account-ids: '417886991538'

      - name: Verify AWS identity
        run: aws sts get-caller-identity

      - name: Upload static assets
        run: |
          aws s3 sync dist/ "s3://$S3_BUCKET/" \
            --exclude "index.html" \
            --cache-control "public, max-age=3600"

      - name: Upload index.html
        run: |
          aws s3 cp dist/index.html "s3://$S3_BUCKET/index.html" \
            --content-type "text/html" \
            --cache-control "no-cache, must-revalidate"

      - name: Invalidate CloudFront cache
        run: |
          INVALIDATION_ID=$(aws cloudfront create-invalidation \
            --distribution-id "$DISTRIBUTION_ID" \
            --paths "/*" \
            --query 'Invalidation.Id' \
            --output text)

          aws cloudfront wait invalidation-completed \
            --distribution-id "$DISTRIBUTION_ID" \
            --id "$INVALIDATION_ID"

      - name: Production smoke test
        run: |
          curl --fail --silent --show-error \
            --retry 3 \
            https://alexpav.click/ \
            -o /tmp/portfolio.html

          grep -q 'id="root"' /tmp/portfolio.html
